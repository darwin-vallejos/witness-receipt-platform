<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Receipt Verification</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .ok { color: green; font-weight: bold; }
    .bad { color: red; font-weight: bold; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>Receipt Verification</h1>
  <p><strong>Receipt ID:</strong> {{ receipt_id }}</p>
  <div id="result">Verifying…</div>

  <script>
    fetch("/api/receipt/{{ receipt_id }}/verify")
      .then(r => r.json())
      .then(d => {
        document.getElementById("result").innerHTML = `
          <p>Status:
            <span class="${d.is_valid ? 'ok' : 'bad'}">
              ${d.is_valid ? 'VERIFIED' : 'INVALID'}
            </span>
          </p>
          <pre>Stored Hash: ${d.stored_hash}
Computed Hash: ${d.computed_hash}</pre>
          <p>Primitive: ${d.primitive_version}</p>
          <p>DOI: <a href="https://doi.org/${d.doi_reference}" target="_blank">${d.doi_reference}</a></p>
        `;
      });
  </script>
</body>
</html>
